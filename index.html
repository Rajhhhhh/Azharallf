 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Form to WhatsApp</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f2f2f2;
    }
    form {
      background: white;
      padding: 20px;
      border-radius: 10px;
      max-width: 400px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #25D366;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #1ebd59;
    }
  </style>
</head>
<body>

  <form id="whatsappForm">
    <h2>Submit Details</h2>
    <input type="text" id="name" placeholder="Name" required>
    <input type="tel" id="mobile" placeholder="Mobile Number" required>
    <input type="text" id="state" placeholder="State" required>
    <input type="text" id="district" placeholder="District" required>
    <button type="submit">Submit</button>
  </form>

  <script>
    document.getElementById("whatsappForm").addEventListener("submit", function(event){
      event.preventDefault();

      const name = document.getElementById("name").value;
      const mobile = document.getElementById("mobile").value;
      const state = document.getElementById("state").value;
      const district = document.getElementById("district").value;

      const message = `Name: ${name}%0AMobile: ${mobile}%0AState: ${state}%0ADistrict: ${district}`;
      const phoneNumber = "7369022818";

      const whatsappURL = `https://wa.me/91${phoneNumber}?text=${message}`;
      window.open(whatsappURL, '_blank');
    });
  </script>

</body>
</html>
